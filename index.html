<!DOCTYPE html>
<html lang="it" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salerno Luxury Apartments — Appartamenti nel centro storico di Salerno</title>
<meta name="description" content="Quattro appartamenti nel centro storico di Salerno: La Dolce Vita, Amalfi Gate, Duomo e Positano Gate. Confronta i prezzi e prenota direttamente.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>

/* ===== temi ===== */
:root,[data-theme="light"]{
  --bg:#f7f3ec; --bg2:#efe8dc; --ink:#1c1a17; --ink2:#5d564c; --muted:#8a8275;
  --acc:#9a7b4f; --acc2:#b48a5a; --line:rgba(28,26,23,.14); --veil:rgba(14,12,10,.42);
  --btn-ink:#fff; --card:#fbf8f3; --grad:linear-gradient(90deg,#9a7b4f,#b48a5a);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Jost,system-ui,sans-serif;font-weight:300;color:var(--ink);background:var(--bg);line-height:1.7;-webkit-font-smoothing:antialiased;transition:background .6s,color .6s}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img{display:block;width:100%;height:100%;object-fit:cover}
.serif{font-family:"Cormorant Garamond",Georgia,serif}
.wrap{max-width:1240px;margin:0 auto;padding:0 28px}
.caps{font-size:.7rem;letter-spacing:.32em;text-transform:uppercase;font-weight:400}
.acc{color:var(--acc)}
.gtext{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.ph{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--c2),var(--c1))}
.ph img{position:absolute;inset:0}

/* ===== header ===== */
header{position:fixed;inset:0 0 auto;z-index:50;color:#f5efe4;transition:background .5s,color .5s,padding .5s,border-color .5s;border-bottom:1px solid transparent}
header .wrap{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:88px;transition:height .5s}
header.solid{background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--ink);border-color:var(--line)}
header.solid .wrap{height:70px}
.hnav{display:flex;gap:30px}
.hnav a{position:relative;font-size:.72rem;letter-spacing:.24em;text-transform:uppercase}
.hnav a::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:1px;background:currentColor;transform:scaleX(0);transform-origin:right;transition:transform .5s cubic-bezier(.7,0,.2,1)}
.hnav a:hover::after{transform:scaleX(1);transform-origin:left}
.brand{text-align:center;line-height:1}
.brand b{display:block;font-family:"Cormorant Garamond",serif;font-weight:400;font-size:1.55rem;letter-spacing:.22em;text-transform:uppercase}
.brand i{display:block;font-family:"Cormorant Garamond",serif;font-size:.95rem;letter-spacing:.08em;margin-top:4px;opacity:.85}
.hright{display:flex;justify-content:flex-end;align-items:center;gap:22px}
.langs{display:flex;gap:6px}
.langs button{width:22px;height:15px;border-radius:2px;overflow:hidden;opacity:.5;transition:opacity .3s,box-shadow .3s;padding:0}
.langs button svg{display:block;width:100%;height:100%}
.langs button.on,.langs button:hover{opacity:1;box-shadow:0 0 0 1px currentColor}
.btn{display:inline-flex;align-items:center;gap:12px;padding:15px 30px;font-size:.7rem;letter-spacing:.28em;text-transform:uppercase;font-weight:400;border:1px solid currentColor;transition:background .4s,color .4s,border-color .4s}
.btn:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}
header .btn{padding:11px 20px}
.btn-solid{background:var(--grad);border-color:transparent;color:var(--btn-ink)}
.btn-solid:hover{background:var(--ink);color:var(--bg)}
.btn-light{color:#f5efe4}
.btn-light:hover{background:#f5efe4;color:#14110d;border-color:#f5efe4}
.btn .arr{display:inline-block;width:26px;height:1px;background:currentColor;position:relative;transition:width .4s}
.btn .arr::after{content:"";position:absolute;right:0;top:-3px;width:7px;height:7px;border-top:1px solid currentColor;border-right:1px solid currentColor;transform:rotate(45deg)}
.btn:hover .arr{width:38px}

/* ===== hero ===== */
.hero{position:relative;height:100vh;min-height:640px;color:#f5efe4;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 2.2s ease}
.slide.on{opacity:1}
.slide .ph{position:absolute;inset:0}
.slide img{transform:scale(1.16)}
.slide.on img{animation:kb 10s cubic-bezier(.2,.6,.3,1) forwards}
@keyframes kb{from{transform:scale(1.16)}to{transform:scale(1.02)}}
.veil{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,.05),var(--veil) 75%),linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,0) 30%,rgba(0,0,0,0) 60%,rgba(0,0,0,.55))}
.hero-c{position:relative;z-index:2;padding:0 24px;max-width:980px}
.hero h1{font-family:"Cormorant Garamond",serif;font-weight:300;font-size:clamp(3rem,8.5vw,7.4rem);line-height:.98;letter-spacing:-.01em;margin:22px 0 28px}
.hero h1 em{font-style:italic;font-weight:300;display:block}
.rule{width:0;height:1px;background:var(--grad);margin:0 auto 34px;transition:width 1.8s .6s cubic-bezier(.7,0,.2,1)}
.in .rule,.rule.in{width:120px}
.hero .caps{opacity:.9}
.hbot{position:absolute;z-index:3;left:0;right:0;bottom:38px}
.hbot .wrap{display:flex;justify-content:space-between;align-items:flex-end}
.counter{font-family:"Cormorant Garamond",serif;font-size:1.05rem;text-align:left}
.counter b{font-weight:400;font-size:2rem;margin-right:6px}
.counter small{display:block;font-family:Jost,sans-serif;font-size:.66rem;letter-spacing:.3em;text-transform:uppercase;opacity:.8;margin-top:6px;min-height:1em;transition:opacity .6s}
.prog{display:flex;gap:10px}
.prog button{width:46px;height:20px;position:relative}
.prog button::before,.prog button::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(255,255,255,.3)}
.prog button::after{background:#f5efe4;transform:scaleX(0);transform-origin:left}
.prog button.on::after{animation:fill 7s linear forwards}
@keyframes fill{to{transform:scaleX(1)}}
.scroll{position:absolute;z-index:3;left:50%;bottom:30px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:10px;font-size:.6rem;letter-spacing:.34em;text-transform:uppercase;opacity:.85}
.scroll i{width:1px;height:46px;background:rgba(255,255,255,.25);position:relative;overflow:hidden}
.scroll i::after{content:"";position:absolute;left:0;top:-50%;width:1px;height:50%;background:#f5efe4;animation:drop 2.2s cubic-bezier(.7,0,.3,1) infinite}
@keyframes drop{to{top:100%}}

/* ===== reveal ===== */
.rv{opacity:0;transform:translateY(34px);transition:opacity 1.3s cubic-bezier(.2,.7,.2,1),transform 1.3s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
.fade{opacity:0;transition:opacity 1.6s ease}.fade.in{opacity:1}
.d1{transition-delay:.15s}.d2{transition-delay:.3s}.d3{transition-delay:.45s}.d4{transition-delay:.6s}.d5{transition-delay:.75s}

/* ===== manifesto ===== */
.manifesto{padding-top:150px;padding-bottom:110px;text-align:center}
.manifesto p{font-family:"Cormorant Garamond",serif;font-weight:300;font-size:clamp(1.7rem,3.4vw,2.7rem);line-height:1.35;max-width:24em;margin:26px auto 0;color:var(--ink)}
.manifesto p em{color:var(--acc)}
.orn{display:flex;align-items:center;justify-content:center;gap:16px;color:var(--acc)}
.orn::before,.orn::after{content:"";width:46px;height:1px;background:currentColor;opacity:.6}

/* ===== stats ===== */
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stats div{padding:52px 20px;text-align:center}
.stats div+div{border-left:1px solid var(--line)}
.stats b{display:block;font-family:"Cormorant Garamond",serif;font-weight:300;font-size:clamp(3.2rem,6vw,4.8rem);line-height:1}
.stats span{display:block;margin-top:12px;color:var(--muted)}

/* ===== residenze ===== */
.sec-h{text-align:center;padding-top:140px;padding-bottom:30px}
.sec-h h2{font-family:"Cormorant Garamond",serif;font-weight:300;font-size:clamp(2.4rem,5vw,4rem);line-height:1.05;margin-top:20px}
.sec-h h2 em{font-style:italic}
.apt{display:grid;grid-template-columns:7fr 5fr;gap:90px;align-items:center;padding:90px 0}
.apt:nth-child(even){grid-template-columns:5fr 7fr}
.apt:nth-child(even) .media{order:2}
.media{position:relative}
.clip{position:relative;aspect-ratio:5/4;overflow:hidden;clip-path:inset(10% 8% 10% 8%);transition:clip-path 1.6s cubic-bezier(.7,0,.2,1)}
.clip.in{clip-path:inset(0 0 0 0)}
.clip .plx{position:absolute;inset:-9% 0;will-change:transform}
.clip .ph{position:absolute;inset:0}
.clip img{transform:scale(1.28);transition:transform 2.2s cubic-bezier(.2,.7,.2,1)}
.clip.in img{transform:scale(1)}
.media:hover .clip.in img{transform:scale(1.04)}
.thumbs{position:absolute;bottom:-34px;display:flex;gap:10px}
.apt:nth-child(odd) .thumbs{right:-30px}
.apt:nth-child(even) .thumbs{left:-30px}
.thumbs .ph{width:120px;aspect-ratio:1;border:6px solid var(--bg);transition:border-color .6s}
.num{font-family:"Cormorant Garamond",serif;font-weight:300;font-size:6.5rem;line-height:.8;color:transparent;-webkit-text-stroke:1px var(--acc);opacity:.75}
.apt h3{font-family:"Cormorant Garamond",serif;font-weight:300;font-size:clamp(2.4rem,4.4vw,3.6rem);line-height:1;margin:18px 0 14px}
.hair{height:1px;background:var(--line);margin:24px 0;transform:scaleX(0);transform-origin:left;transition:transform 1.4s .3s cubic-bezier(.7,0,.2,1)}
.hair.in{transform:scaleX(1)}
.apt p{color:var(--ink2);max-width:34em}
.meta{display:flex;flex-wrap:wrap;gap:8px 26px;margin:26px 0 30px;font-size:.84rem;color:var(--ink2)}
.meta b{font-weight:400;color:var(--ink)}
.price{display:flex;align-items:baseline;gap:10px;margin-bottom:30px}
.price small{color:var(--muted)}
.price b{font-family:"Cormorant Garamond",serif;font-weight:400;font-size:2.2rem;line-height:1}
.link{display:inline-flex;align-items:center;gap:14px;font-size:.7rem;letter-spacing:.28em;text-transform:uppercase;padding-bottom:8px;position:relative}
.link::after{content:"";position:absolute;left:0;bottom:0;width:100%;height:1px;background:var(--grad);transform-origin:left;transition:transform .6s cubic-bezier(.7,0,.2,1)}
.link:hover::after{transform:scaleX(.35)}
.link .arr{display:inline-block;width:26px;height:1px;background:currentColor;position:relative;transition:width .4s}
.link .arr::after{content:"";position:absolute;right:0;top:-3px;width:7px;height:7px;border-top:1px solid currentColor;border-right:1px solid currentColor;transform:rotate(45deg)}
.link:hover .arr{width:40px}

/* ===== banner ===== */
.banner{position:relative;height:88vh;min-height:520px;margin-top:120px;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center;color:#f5efe4}
.banner .plx{position:absolute;inset:-12% 0}
.banner .ph{position:absolute;inset:0}
.banner .veil{background:var(--veil)}
.banner .in-c{position:relative;z-index:2;padding:0 24px}
.banner h2{font-family:"Cormorant Garamond",serif;font-weight:300;font-style:italic;font-size:clamp(2.2rem,5vw,4.2rem);line-height:1.12;max-width:16em;margin:22px auto 40px}

/* ===== footer ===== */
footer{padding:110px 0 120px;text-align:center}
footer .brand{color:var(--ink)}
footer .brand b{font-size:2rem}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:30px;margin:60px 0 50px;padding:44px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.fgrid .caps{color:var(--acc);margin-bottom:12px;display:block}
.fgrid a,.fgrid span.v{display:block;font-size:.95rem;color:var(--ink2)}
.fgrid a:hover{color:var(--ink)}
.legal{font-size:.72rem;color:var(--muted);letter-spacing:.08em}


@media (max-width:980px){
  .hnav{display:none}
  header .wrap{grid-template-columns:auto 1fr;}
  .brand{text-align:left}
  .brand b{font-size:1.15rem;letter-spacing:.16em}
  .hright .btn{display:none}
  .apt,.apt:nth-child(even){grid-template-columns:1fr;gap:56px;padding:60px 0}
  .apt:nth-child(even) .media{order:0}
  .apt:nth-child(odd) .thumbs,.apt:nth-child(even) .thumbs{right:12px;left:auto}
  .thumbs .ph{width:84px}
  .num{font-size:4.6rem}
  .stats div{padding:34px 4px}
  .stats b{font-size:2.6rem}
  .stats span{font-size:.56rem;letter-spacing:.18em}
  .fgrid{grid-template-columns:1fr}
  .manifesto{padding-top:110px;padding-bottom:80px}
  .sec-h{padding-top:100px;padding-bottom:10px}
  .hbot{bottom:84px}
  .scroll{display:none}
}
@media (prefers-reduced-motion:reduce){
  .rv,.fade,.clip,.clip img,.hair,.rule{transition:none!important;opacity:1;transform:none;clip-path:none}
  .rule{width:120px}.hair{transform:none}
  .slide.on img,.prog button.on::after,.scroll i::after{animation:none}
}


/* ===== pagine ===== */
.page{display:none}
.page.show{display:block;animation:pg .7s ease}
@keyframes pg{from{opacity:0}}
header.inner{background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--ink);border-color:var(--line)}
.hnav a.on::after{transform:scaleX(1)}
.ptop{padding-top:170px;text-align:center}
.ptop h1{font-family:"Cormorant Garamond",serif;font-weight:300;font-size:clamp(2.8rem,6vw,5rem);line-height:1;margin-top:22px}
.ptop h1 em{font-style:italic}
.ptop p{max-width:40em;margin:22px auto 0;color:var(--ink2)}

/* home: anteprima residenze */
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:26px;padding-top:40px}
.card{display:block;color:inherit}
.card .clip{aspect-ratio:3/4}
.card h3{font-family:"Cormorant Garamond",serif;font-weight:300;font-size:1.9rem;margin:20px 0 4px}
.card .caps{color:var(--muted);font-size:.62rem}
.card .from{margin-top:10px;font-size:.84rem;color:var(--ink2)}
.card .from b{font-family:"Cormorant Garamond",serif;font-weight:400;font-size:1.35rem;color:var(--ink)}
.card:hover .clip.in img{transform:scale(1.05)}

/* strutture */
.snav{position:sticky;top:70px;z-index:20;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);margin-top:60px}
.snav .wrap{display:flex;gap:34px;justify-content:center;overflow-x:auto;scrollbar-width:none}
.snav a{padding:18px 0;white-space:nowrap;font-size:.68rem;letter-spacing:.26em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid transparent}
.snav a.on{color:var(--acc);border-color:var(--acc)}
.res{padding:110px 0 40px;border-bottom:1px solid var(--line);scroll-margin-top:130px}
.res-h{display:flex;justify-content:space-between;align-items:flex-end;gap:30px;flex-wrap:wrap;margin-bottom:40px}
.res-h h2{font-family:"Cormorant Garamond",serif;font-weight:300;font-size:clamp(2.6rem,5vw,4.2rem);line-height:1;margin-top:14px}
.gal{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:1fr 1fr;gap:10px;aspect-ratio:2/1}
.gal .g{position:relative;overflow:hidden;cursor:zoom-in}
.gal .g:first-child{grid-row:span 2}
.gal .g .ph{position:absolute;inset:0}
.gal .g img{transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
.gal .g:hover img{transform:scale(1.05)}
.gal .g:nth-child(n+6){display:none}
.gcount{display:none;margin-top:12px;font-size:.62rem;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.gal .more{position:absolute;right:14px;bottom:14px;z-index:2;background:rgba(247,243,236,.92);color:#1c1a17;padding:8px 14px;font-size:.62rem;letter-spacing:.24em;text-transform:uppercase}
.res-b{display:grid;grid-template-columns:1.3fr 1fr;gap:80px;margin-top:60px}
.res-b p{color:var(--ink2);font-size:1.02rem}
.specs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:34px 0}
.specs div{padding:22px 6px;text-align:center}
.specs div+div{border-left:1px solid var(--line)}
.specs b{display:block;font-family:"Cormorant Garamond",serif;font-weight:300;font-size:2.2rem;line-height:1;color:var(--acc)}
.specs span{font-size:.6rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.dot h4{font-size:.68rem;letter-spacing:.3em;text-transform:uppercase;font-weight:400;color:var(--acc);margin-bottom:18px}
.dot ul{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:14px 20px}
.dot li{display:flex;align-items:center;gap:12px;font-size:.92rem;color:var(--ink2)}
.dot li svg{flex:none;width:20px;height:20px;stroke:var(--acc);fill:none;stroke-width:1.3}
.side-book{border:1px solid var(--line);padding:30px;margin-top:34px}
.side-book .price{margin-bottom:22px}

/* lightbox */
.lb{position:fixed;inset:0;z-index:300;background:rgba(14,12,10,.94);display:flex;align-items:center;justify-content:center}
.lb[hidden]{display:none}
.lb .ph{position:relative;width:min(1200px,92vw);height:min(80vh,800px);background:none}
.lb img{object-fit:contain}
.lb button{position:absolute;color:#f5efe4;font-size:2rem;width:56px;height:56px}
.lb .x{top:16px;right:16px}.lb .p{left:10px;top:50%;transform:translateY(-50%)}.lb .n{right:10px;top:50%;transform:translateY(-50%)}
.lb .c{position:absolute;bottom:22px;left:0;right:0;text-align:center;color:#cfc6b6;font-size:.7rem;letter-spacing:.3em}

/* prenota */
.bk-top{display:grid;grid-template-columns:1.6fr 1fr;gap:40px;align-items:start;margin-top:60px}
.calbox{border:1px solid var(--line);padding:30px;background:var(--card)}
.cal-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cal-nav button{width:38px;height:38px;border:1px solid var(--line);font-size:1.1rem}
.cal-nav button:disabled{opacity:.25}
.cal-nav span{font-size:.8rem;color:var(--ink2)}
.months{display:grid;grid-template-columns:1fr 1fr;gap:34px}
.month h4{font-family:"Cormorant Garamond",serif;font-weight:400;font-size:1.35rem;text-align:center;margin-bottom:6px;text-transform:capitalize}
.dow,.days{display:grid;grid-template-columns:repeat(7,1fr)}
.dow span{font-size:.6rem;letter-spacing:.14em;text-align:center;color:var(--muted);padding:4px 0}
.day{height:44px;display:flex;align-items:center;justify-content:center}
.day button{width:100%;height:100%;font-size:.88rem;transition:background .2s}
.day button:hover{background:color-mix(in srgb,var(--acc) 16%,transparent)}
.day.off button{color:var(--muted);opacity:.35;pointer-events:none;text-decoration:line-through}
.day.in{background:color-mix(in srgb,var(--acc) 13%,transparent)}
.day.s button,.day.e button{background:var(--grad);color:#fff}
.panel{border:1px solid var(--line);padding:30px;background:var(--card)}
.panel .row{padding:18px 0;border-bottom:1px solid var(--line)}
.panel .row:first-child{padding-top:0}
.panel .row:last-child{border-bottom:0;padding-bottom:0}
.panel .lbl{font-size:.62rem;letter-spacing:.26em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:10px}
.panel .val{font-family:"Cormorant Garamond",serif;font-size:1.5rem}
.step{display:flex;align-items:center;gap:16px}
.step button{width:36px;height:36px;border:1px solid var(--line);font-size:1.1rem}
.step b{font-weight:400;min-width:22px;text-align:center;font-size:1.2rem}
.sorts{display:flex;gap:18px;flex-wrap:wrap}
.sorts button{font-size:.66rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);padding-bottom:6px;border-bottom:1px solid transparent}
.sorts button.on{color:var(--acc);border-color:var(--acc)}
.panel .note{font-size:.76rem;color:var(--muted);margin-top:18px}
.cmp-h{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;margin:90px 0 26px}
.cmp-h h2{font-family:"Cormorant Garamond",serif;font-weight:300;font-size:clamp(2.2rem,4vw,3.2rem)}
.cmp-h span{font-size:.84rem;color:var(--muted)}
.cmp{display:grid;grid-template-columns:repeat(4,minmax(250px,1fr));gap:22px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:12px}

  $("cNum").textContent=String(sIdx+1).padStart(2,"0");
  const n=$("cName");n.style.opacity=0;setTimeout(()=>{n.textContent=SL[sIdx].a.nome;n.style.opacity=1;},300);
}
function startSlides(){clearInterval(sTimer);sTimer=setInterval(()=>{if(page==="home")go(sIdx+1);},7000);}
$("prog").addEventListener("click",e=>{const b=e.target.closest("button");if(b){go(+b.dataset.i);startSlides();}});

/* ===== reveal ===== */
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const io="IntersectionObserver" in window?new IntersectionObserver(es=>es.forEach(en=>{
  if(!en.isIntersecting)return; en.target.classList.add("in");
  const c=en.target.querySelector("[data-count]");if(c)countUp(c);
  io.unobserve(en.target);
}),{threshold:.14,rootMargin:"0px 0px -5% 0px"}):null;
function observe(){document.querySelectorAll(".page.show .rv:not(.in),.page.show .fade:not(.in),.page.show .clip:not(.in),.page.show .hair:not(.in),.page.show .rule:not(.in)").forEach(el=>{if(io&&!reduce)io.observe(el);else el.classList.add("in");});}
function fmtNum(v,d){let s=v.toFixed(d);return comma()?s.replace(".",","):s;}
function countUp(el){const to=+el.dataset.count,d=+el.dataset.dec;if(reduce){el.textContent=fmtNum(to,d);return;}
  const t0=performance.now(),dur=2000;const step=n=>{const p=Math.min(1,(n-t0)/dur),e=1-Math.pow(1-p,4);el.textContent=fmtNum(to*e,d);if(p<1)requestAnimationFrame(step);};requestAnimationFrame(step);}

/* ===== date / prezzi ===== */
const bk={ci:null,co:null,g:2,sort:"fixed",view:null,focus:null};
const pad=n=>String(n).padStart(2,"0"), iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=(()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())})();
bk.view=new Date(today.getFullYear(),today.getMonth(),1);
const addD=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n), nb=(a,b)=>Math.round((b-a)/864e5);
const loc=()=>({it:"it-IT",en:"en-GB",fr:"fr-FR",de:"de-DE"})[L];
const fmtD=(d,o)=>d.toLocaleDateString(loc(),o||{day:"numeric",month:"short"});
const nightP=(id,d)=>{const p=PREZZI[id],w=d.getDay();return (w===5||w===6)?p.weekend:p.feriale;};
const busy=(id,d)=>{const k=iso(d);return OCCUPATO[id].some(([a,b])=>k>=a&&k<b);};
function quote(a){ if(!bk.ci||!bk.co) return null; const n=nb(bk.ci,bk.co); let tot=0,bz=false;
  for(let i=0;i<n;i++){const d=addD(bk.ci,i);if(busy(a.id,d))bz=true;tot+=nightP(a.id,d);}
  return {n,tot,avg:Math.round(tot/n),bz,short:n<MIN_NOTTI,over:bk.g>a.ospiti,tax:TASSA*bk.g*n}; }
const allBusy=d=>APTS.every(a=>busy(a.id,d));

/* ===== render: home ===== */
function renderHome(){
  $("prog").innerHTML=SL.map((x,i)=>`<button data-i="${i}" class="${i===sIdx?"on":""}" aria-label="${x.a.nome}"></button>`).join("");
  $("cName").textContent=SL[sIdx].a.nome; $("cTot").textContent=String(SL.length).padStart(2,"0");
  $("cards").innerHTML=APTS.map((a,i)=>`
    <a class="card rv d${i}" href="#strutture-${a.id}">
      <div class="clip"><div class="plx">${ph(a,0,1200)}</div></div>
      <h3>${a.nome}</h3><div class="caps">${a.tag[L]}</div>
      <div class="from">${t("from")} <b>${minP(a)} €</b> ${t("night")} · ★ ${rating(a)}</div>
    </a>`).join("");
}

/* ===== render: strutture ===== */
function renderStrutture(){
  $("snav").innerHTML=APTS.map(a=>`<a href="#strutture-${a.id}" data-s="${a.id}">${a.nome}</a>`).join("");
  $("resList").innerHTML=APTS.map((a,i)=>`
    <section class="res" id="res-${a.id}" data-id="${a.id}">
      <div class="res-h">
        <div><div class="num rv">0${i+1}</div><h2 class="rv d1">${a.nome}</h2><div class="caps acc rv d2" style="margin-top:14px">${a.tag[L]}</div></div>
        <div class="price rv d2" style="margin:0"><small>${t("from")}</small><b>${minP(a)} €</b><small>${t("night")}</small></div>
      </div>
      <div class="gal rv d1">${a.foto.map((_,k)=>`<div class="g" data-lb="${a.id}" data-k="${k}">${ph(a,k,1200)}${k===2?`<span class="more">${a.foto.length} ${t("photos")}</span>`:""}</div>`).join("")}</div>
      <div class="gcount">← ${a.foto.length} ${t("photos")} →</div>
      <div class="res-b">
        <div>
          <p class="rv">${a.desc[L]}</p>
          <div class="specs rv d1">
            <div><b>${a.ospiti}</b><span>${t("sp_g")}</span></div><div><b>${a.camere}</b><span>${t("sp_r")}</span></div>
            <div><b>${a.letti}</b><span>${t("sp_b")}</span></div><div><b>${a.bagni}</b><span>${t("sp_ba")}</span></div>
          </div>
          <div class="dot rv d2"><h4>${t("dot")}</h4><ul>${a.servizi.map(s=>`<li><svg viewBox="0 0 24 24">${ICON[s]||""}</svg>${t("a_"+s)}</li>`).join("")}</ul></div>
        </div>
        <div class="side-book rv d2">
          <div class="caps" style="color:var(--muted)">★ ${rating(a)} · ${a.reviews} ${t("reviews")}</div>
          <div class="hair"></div>
          <div class="price"><small>${t("from")}</small><b>${minP(a)} €</b><small>${t("night")}</small></div>
          <div style="display:flex;flex-direction:column;gap:14px">
            <a class="btn btn-solid" href="#prenota-${a.id}" style="justify-content:center"><span>${t("book")}</span><span class="arr"></span></a>
            <a class="link" style="align-self:center" href="${waUrl(t("waInfo").replace("{apt}",a.nome))}" target="_blank" rel="noopener">${t("info")}<span class="arr"></span></a>
          </div>
        </div>
      </div>
    </section>`).join("");
}

/* ===== render: prenota ===== */
function monthHTML(base){
  const y=base.getFullYear(),m=base.getMonth(),first=new Date(y,m,1),off=(first.getDay()+6)%7,dim=new Date(y,m+1,0).getDate();
  const dows=[0,1,2,3,4,5,6].map(i=>new Date(2024,0,1+i).toLocaleDateString(loc(),{weekday:"narrow"}));
  let h=`<div class="month"><h4>${first.toLocaleDateString(loc(),{month:"long",year:"numeric"})}</h4><div class="dow">${dows.map(d=>`<span>${d}</span>`).join("")}</div><div class="days">`;
  for(let i=0;i<off;i++)h+=`<div class="day"></div>`;
  for(let d=1;d<=dim;d++){const dt=new Date(y,m,d),c=["day"];
    if(dt<today||allBusy(dt))c.push("off");
    if(bk.ci&&+dt===+bk.ci)c.push("s"); if(bk.co&&+dt===+bk.co)c.push("e");
    if(bk.ci&&bk.co&&dt>bk.ci&&dt<bk.co)c.push("in");
    h+=`<div class="${c.join(" ")}"><button data-d="${iso(dt)}">${d}</button></div>`;}
  return h+`</div></div>`;
}
function renderPrenota(){
  const m2=new Date(bk.view.getFullYear(),bk.view.getMonth()+1,1);
  $("cMonths").innerHTML=monthHTML(bk.view)+monthHTML(m2);
  $("cPrev").disabled=bk.view<=new Date(today.getFullYear(),today.getMonth(),1);
  $("cHint").textContent=!bk.ci?t("pick_in"):!bk.co?t("pick_out"):`${nb(bk.ci,bk.co)} ${t("nights")}`;
  $("pDates").textContent=bk.ci?`${fmtD(bk.ci)} → ${bk.co?fmtD(bk.co):"…"}`:"—";
  $("gN").textContent=bk.g;
  document.querySelectorAll("#sorts button").forEach(b=>b.classList.toggle("on",b.dataset.s===bk.sort));
  const list=APTS.map(a=>({a,q:quote(a)}));
  const ok=x=>x.q&&!x.q.bz&&!x.q.over&&!x.q.short;
  list.sort((x,y)=>{
    if(bk.sort==="fixed")return 0;
    if(bk.sort==="guests")return y.a.ospiti-x.a.ospiti;
    if(bk.sort==="rating")return y.a.rating-x.a.rating||y.a.reviews-x.a.reviews;
    if(bk.ci&&bk.co){if(ok(x)!==ok(y))return ok(x)?-1:1;return x.q.tot-y.q.tot;}
    return minP(x.a)-minP(y.a);
  });
  const valid=list.filter(ok), best=valid.length>1?valid.reduce((b,x)=>x.q.tot<b.q.tot?x:b).a.id:null;
  $("cmpNote").textContent=bk.ci&&bk.co?`${t("forDates")} ${fmtD(bk.ci)} – ${fmtD(bk.co)} · ${bk.g} ${t("g")}`:t("noDates");
  const o={day:"numeric",month:"long",year:"numeric"};
  $("cmp").innerHTML=list.map(({a,q})=>{
    const na=q&&(q.bz||q.over);
    const badge=q&&q.bz?`<span class="badge no">${t("na")}</span>`:q&&q.over?`<span class="badge no">${t("tooMany")}</span>`:a.id===best?`<span class="badge">${t("best")}</span>`:"";
    const tot=q?(q.short?`<b>—</b><small>${t("minN").replace("{n}",MIN_NOTTI)}</small>`:`<b>${q.tot} €</b><small>${q.n} ${q.n>1?t("nights"):t("night1")} · ${t("avg")} ${q.avg} € ${t("night")}</small>${TASSA?`<small>${t("tax")} ${q.tax} €</small>`:""}`)
                 :`<small>${t("from")}</small><b>${minP(a)} €</b><small>${t("night")}</small>`;
    const can=q&&!na&&!q.short;
    const msg=can?t("waMsg").replace("{apt}",a.nome).replace("{ci}",fmtD(bk.ci,o)).replace("{co}",fmtD(bk.co,o)).replace("{n}",q.n).replace("{g}",bk.g).replace("{tot}",q.tot):t("waInfo").replace("{apt}",a.nome);
    return `<div class="cc ${a.id===best?"best":""} ${na?"na":""} ${bk.focus===a.id?"focus":""}" id="cc-${a.id}">
      ${badge}<div class="cimg">${ph(a,0,1200)}</div>
      <div class="cbody">
        <h3>${a.nome}</h3><div class="caps">${a.tag[L]}</div>
        <div class="ctot">${tot}</div>
        <div class="crows">
          <div class="crow"><span>${t("r_g")}</span><span>${a.ospiti}</span></div>
          <div class="crow"><span>${t("r_rb")}</span><span>${a.camere} / ${a.bagni}</span></div>
          <div class="crow"><span>${t("r_rt")}</span><span>★ ${rating(a)} · ${a.reviews}</span></div>
          ${CMP_KEYS.map(k=>`<div class="crow"><span>${t("a_"+k)}</span>${a.servizi.includes(k)?'<span class="y">✓</span>':'<span class="n">—</span>'}</div>`).join("")}
        </div>
        <div class="cact">
          <a class="btn btn-solid" href="${waUrl(msg)}" target="_blank" rel="noopener" ${q&&!can?'aria-disabled="true"':""}><span>${q?t("req"):t("info")}</span><span class="arr"></span></a>
          <a class="link" href="#strutture-${a.id}">${t("details")}<span class="arr"></span></a>
        </div>
      </div></div>`;
  }).join("");
}

/* ===== lightbox ===== */
let lbA=null,lbK=0;
function lbShow(){ $("lbImg").innerHTML=ph(lbA,lbK,1920,true); $("lbC").textContent=`${lbA.nome} · ${lbK+1} / ${lbA.foto.length}`; }
document.addEventListener("click",e=>{const g=e.target.closest("[data-lb]");if(g){lbA=APTS.find(a=>a.id===g.dataset.lb);lbK=+g.dataset.k;$("lb").hidden=false;lbShow();}});
$("lb").addEventListener("click",e=>{
  if(e.target.closest(".n")){lbK=(lbK+1)%lbA.foto.length;lbShow();}
  else if(e.target.closest(".p")){lbK=(lbK-1+lbA.foto.length)%lbA.foto.length;lbShow();}
  else if(e.target.closest(".x")||e.target.id==="lb"){$("lb").hidden=true;}
});
document.addEventListener("keydown",e=>{if($("lb").hidden)return;if(e.key==="Escape")$("lb").hidden=true;if(e.key==="ArrowRight"){lbK=(lbK+1)%lbA.foto.length;lbShow();}if(e.key==="ArrowLeft"){lbK=(lbK-1+lbA.foto.length)%lbA.foto.length;lbShow();}});

/* ===== testi, lingua ===== */
function renderAll(){
  document.documentElement.lang=L;
  document.querySelectorAll("[data-t]").forEach(el=>{const v=t(el.dataset.t);if(el.hasAttribute("data-h"))el.innerHTML=v;else el.textContent=v;});
  document.querySelectorAll(".langs").forEach(b=>b.innerHTML=LANGS.map(l=>`<button data-l="${l}" class="${l===L?"on":""}" aria-label="${l.toUpperCase()}">${FLAGS[l]}</button>`).join(""));
  $("waFab").href=waUrl(t("waGen"));
  renderHome(); renderStrutture(); renderPrenota();
  document.querySelectorAll("[data-count]").forEach(c=>{if(c.closest(".in"))c.textContent=fmtNum(+c.dataset.count,+c.dataset.dec);});
  document.querySelectorAll(".page.show .rv,.page.show .clip,.page.show .hair,.page.show .fade").forEach(el=>{const r=el.getBoundingClientRect();if(r.bottom<innerHeight&&seenPage[page])el.classList.add("in");});
  observe();
}
const seenPage={};

/* ===== router ===== */
let page="home";
function route(){
  const h=(location.hash.slice(1)||"home"); const [p,sub]=h.split("-");
  page=["home","strutture","prenota"].includes(p)?p:"home";
  document.querySelectorAll(".page").forEach(x=>x.classList.toggle("show",x.id==="p-"+page));
  document.querySelectorAll("[data-p]").forEach(a=>a.classList.toggle("on",a.dataset.p===page));
  $("hdr").classList.toggle("inner",page!=="home");
  bk.focus=page==="prenota"&&sub?sub:null;
  if(page==="prenota") renderPrenota();
  seenPage[page]=true; observe(); onScroll();
  if(sub&&page==="strutture"){const el=$("res-"+sub);setTimeout(()=>el&&el.scrollIntoView({behavior:"smooth"}),60);}
  else if(sub&&page==="prenota"){window.scrollTo(0,0);setTimeout(()=>{const el=$("cc-"+sub);if(el)el.scrollIntoView({behavior:"smooth",block:"nearest",inline:"start"});},120);}
  else window.scrollTo(0,0);
}
addEventListener("hashchange",route);

/* ===== eventi ===== */
document.addEventListener("click",e=>{
  const lb=e.target.closest(".langs button");if(lb){L=lb.dataset.l;store.set("sla_l",L);renderAll();return;}
  const db=e.target.closest("#cMonths button[data-d]");if(db){const [y,m,d]=db.dataset.d.split("-").map(Number),dt=new Date(y,m-1,d);
    if(!bk.ci||bk.co){bk.ci=dt;bk.co=null;}else if(dt<=bk.ci){bk.ci=dt;}else{bk.co=dt;}
    renderPrenota(); if(bk.co) setTimeout(()=>document.querySelector(".cmp-h").scrollIntoView({behavior:"smooth",block:"start"}),200); return;}
  const sb=e.target.closest("#sorts button");if(sb){bk.sort=sb.dataset.s;renderPrenota();}
});
$("cPrev").onclick=()=>{bk.view=new Date(bk.view.getFullYear(),bk.view.getMonth()-1,1);renderPrenota();};
$("cNext").onclick=()=>{bk.view=new Date(bk.view.getFullYear(),bk.view.getMonth()+1,1);renderPrenota();};
$("gM").onclick=()=>{bk.g=Math.max(1,bk.g-1);renderPrenota();};
$("gP").onclick=()=>{bk.g=Math.min(Math.max(...APTS.map(a=>a.ospiti)),bk.g+1);renderPrenota();};

const hdr=$("hdr");let tick=false;
function onScroll(){
  hdr.classList.toggle("solid",page==="home"&&scrollY>innerHeight*.75);
  if(page==="strutture"){let cur=null;document.querySelectorAll(".res").forEach(s=>{if(s.getBoundingClientRect().top<200)cur=s.dataset.id;});document.querySelectorAll("#snav a").forEach(a=>a.classList.toggle("on",a.dataset.s===cur));}
  if(reduce)return;
  const H=innerHeight;
  document.querySelectorAll(".page.show .clip .plx,.page.show .banner .plx").forEach(p=>{const r=p.parentElement.getBoundingClientRect();if(r.bottom<0||r.top>H)return;const k=(r.top+r.height/2-H/2)/H;p.style.transform=`translateY(${(-k*(p.closest(".banner")?90:30)).toFixed(1)}px)`;});
}
addEventListener("scroll",()=>{if(tick)return;tick=true;requestAnimationFrame(()=>{onScroll();tick=false;});},{passive:true});

$("yr").textContent=new Date().getFullYear();
renderAll(); route(); go(0); startSlides();
</script>
</body>

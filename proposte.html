<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salerno Luxury Apartments — 3 proposte di Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--sea:#14324a;--sea2:#1f4b6b;--soft:#e6eef3;--terra:#c4693d;--terra2:#a9532b;--sand:#f6f1e9;--sand2:#ece3d4;--ink:#1b232b;--muted:#68727c;--line:#e2dbcf;color-scheme:light only}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Outfit,system-ui,sans-serif;color:var(--ink);background:var(--sand);line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,.serif{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;line-height:1.08}
a{color:inherit;text-decoration:none}
button{font:inherit;border:0;background:none;cursor:pointer;color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
img{display:block;width:100%;height:100%;object-fit:cover}
.ph{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--c2),var(--c1))}
.ph img{position:absolute;inset:0}

/* switcher */
.switch{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:100;display:flex;gap:4px;background:rgba(20,50,74,.92);backdrop-filter:blur(10px);padding:5px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.switch button{color:#cfdbe4;padding:9px 16px;border-radius:999px;font-size:.86rem;white-space:nowrap}
.switch button.on{background:var(--terra);color:#fff}
.v{display:none}.v.on{display:block}

/* shared nav */
.nav{display:flex;align-items:center;justify-content:space-between;height:72px}
.brand{display:flex;flex-direction:column;line-height:1}
.brand b{font-family:"Cormorant Garamond",serif;font-size:1.45rem;font-weight:600;letter-spacing:.01em}
.brand small{font-size:.6rem;letter-spacing:.32em;text-transform:uppercase;margin-top:4px;color:var(--terra)}
.menu{display:flex;gap:26px;font-size:.92rem}
.menu a{opacity:.85}.menu a:hover{opacity:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border-radius:999px;font-weight:500;font-size:.95rem;transition:.2s}
.b-terra{background:var(--terra);color:#fff}.b-terra:hover{background:var(--terra2)}
.b-sea{background:var(--sea);color:#fff}
.b-line{border:1px solid currentColor}
.star{color:var(--terra)}
.eyebrow{font-size:.72rem;letter-spacing:.28em;text-transform:uppercase;font-weight:500;color:var(--terra)}

/* ===== A: foto + ricerca ===== */
.A .hero{position:relative;height:min(92vh,780px);color:#fff;display:flex;flex-direction:column}
.A .hero .ph{position:absolute;inset:0}
.A .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,25,38,.55) 0%,rgba(10,25,38,.05) 35%,rgba(10,25,38,.15) 55%,rgba(10,25,38,.8) 100%)}
.A .hero>.wrap{position:relative;z-index:2;width:100%}
.A .hero .brand small{color:#f5c9a8}
.A .hero-c{margin-top:auto;padding-bottom:40px}
.A h1{font-size:clamp(2.6rem,7vw,5.4rem);max-width:13ch;margin:12px 0 26px}
.A h1 i{font-weight:500;color:#f5c9a8}
.A .search{display:grid;grid-template-columns:1fr 1fr .8fr auto;background:#fff;border-radius:20px;padding:8px;gap:4px;max-width:820px;box-shadow:0 20px 50px rgba(0,0,0,.3);color:var(--ink)}
.A .search label{display:flex;flex-direction:column;padding:8px 16px;border-radius:14px;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.A .search label:hover{background:var(--sand)}
.A .search input,.A .search select{border:0;font:inherit;font-size:1rem;color:var(--ink);background:none;letter-spacing:0;text-transform:none;margin-top:2px;outline:none}
.A .search .btn{border-radius:14px;padding:0 28px}
.A .trust{display:flex;gap:22px;flex-wrap:wrap;margin-top:18px;font-size:.9rem;opacity:.92}
.A .sec{padding:80px 0}
.A .sh{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:30px;flex-wrap:wrap}
.A .sh h2{font-size:clamp(2rem,4vw,3rem);color:var(--sea)}
.A .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.A .card .ph{aspect-ratio:4/5;border-radius:18px}
.A .card .ph img{transition:transform .6s}
.A .card:hover .ph img{transform:scale(1.05)}
.A .card h3{font-size:1.5rem;color:var(--sea);margin:14px 0 2px}
.A .card .m{font-size:.86rem;color:var(--muted)}
.A .card .r{display:flex;justify-content:space-between;margin-top:6px;font-size:.88rem}
.A .band{background:var(--sea);color:#fff;border-radius:24px;padding:44px;display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:30px;align-items:center}
.A .band h3{font-size:2rem}
.A .band b{display:block;font-family:"Cormorant Garamond",serif;font-size:2.4rem;color:#f5c9a8;line-height:1}
.A .band span{font-size:.88rem;opacity:.8}

/* ===== B: rivista ===== */
.B{background:#fbf8f3}
.B .nav{border-bottom:1px solid var(--line)}
.B .nav .brand b{color:var(--sea)}
.B .intro{display:grid;grid-template-columns:1fr 1fr;gap:50px;align-items:center;padding:60px 0 80px}
.B h1{font-size:clamp(3rem,7.5vw,6.2rem);color:var(--sea);letter-spacing:-.01em}
.B h1 i{color:var(--terra);font-weight:500}
.B .intro p{font-size:1.12rem;color:#46515b;max-width:42ch;margin:26px 0 30px;font-weight:300}
.B .stack{position:relative;aspect-ratio:4/5}
.B .stack .ph{position:absolute;border-radius:4px;box-shadow:0 20px 50px rgba(20,50,74,.18)}
.B .stack .p1{inset:0 18% 14% 0}
.B .stack .p2{width:46%;aspect-ratio:3/4;right:0;bottom:0;border:8px solid #fbf8f3}
.B .idx{display:flex;gap:28px;padding:22px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);overflow-x:auto;font-size:.9rem;color:var(--muted)}
.B .idx a{white-space:nowrap}.B .idx a b{color:var(--terra);font-weight:500;margin-right:6px}
.B .apt{display:grid;grid-template-columns:7fr 5fr;gap:56px;align-items:center;padding:90px 0;border-bottom:1px solid var(--line)}
.B .apt:nth-of-type(even){grid-template-columns:5fr 7fr}
.B .apt:nth-of-type(even) .pics{order:2}
.B .pics{display:grid;grid-template-columns:2fr 1fr;gap:10px;aspect-ratio:3/2}
.B .pics .ph{border-radius:4px}
.B .pics .ph:first-child{grid-row:span 2}
.B .num{font-family:"Cormorant Garamond",serif;font-size:5rem;line-height:.8;color:var(--sand2)}
.B .apt h2{font-size:clamp(2.2rem,4vw,3.2rem);color:var(--sea);margin:8px 0 14px}
.B .apt p{color:#46515b;margin-bottom:20px}
.B .facts{display:flex;gap:22px;font-size:.88rem;color:var(--muted);margin-bottom:26px;flex-wrap:wrap}
.B .facts b{display:block;color:var(--ink);font-size:1.2rem;font-weight:500}
.B .quote{text-align:center;padding:100px 0}
.B .quote h2{font-size:clamp(2rem,4.5vw,3.4rem);color:var(--sea);max-width:22ch;margin:0 auto 26px;font-style:italic;font-weight:500}

/* ===== C: strutture subito ===== */

footer{background:var(--sea);color:#cfdbe4;padding:40px 0 90px;font-size:.88rem}
footer .wrap{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
footer b{font-family:"Cormorant Garamond",serif;font-size:1.3rem;color:#fff;font-weight:600}

@media (max-width:900px){
 .menu{display:none}
 .A .cards{grid-template-columns:repeat(2,1fr)}
 .A .band{grid-template-columns:1fr 1fr;padding:30px}
 .A .band h3{grid-column:span 2}
 .B .intro,.B .apt,.B .apt:nth-of-type(even){grid-template-columns:1fr;gap:28px}
 .B .apt:nth-of-type(even) .pics{order:0}
 .B .apt{padding:56px 0}
}
@media (max-width:600px){
 .A .search{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
 .A .search label{padding:8px 10px}
 .A .search input{width:100%}
 .A .search .btn{grid-column:span 2;padding:14px}
 .A .hero{height:auto;min-height:92vh}
 .A .cards{grid-template-columns:1fr 1fr;gap:12px}
 .A .card h3{font-size:1.2rem}
 .A .card .r{flex-direction:column}
 .switch button{padding:8px 11px;font-size:.8rem}
}

/* ===== C: animata ===== */
.D{background:#fbf8f3}
.D .dh{position:relative;height:100vh;min-height:620px;color:#fff;overflow:hidden;display:flex;flex-direction:column}
.D .dslide{position:absolute;inset:0;opacity:0;transition:opacity 1.8s ease}
.D .dslide.on{opacity:1}
.D .dslide .ph{position:absolute;inset:0}
.D .dslide img{transform:scale(1.14)}
.D .dslide.on img{animation:kb 9s ease-out forwards}
@keyframes kb{from{transform:scale(1.14)}to{transform:scale(1)}}
.D .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,25,38,.55) 0%,rgba(10,25,38,.1) 40%,rgba(10,25,38,.75) 100%)}
.D .dh>.wrap{position:relative;z-index:2;width:100%}
.D .dh .brand small{color:#f5c9a8}
.D .dh-c{margin-top:auto;padding-bottom:160px}
.D h1{font-size:clamp(2.8rem,7.5vw,6rem);max-width:12ch;margin:14px 0 18px}
.D h1 i{color:#f5c9a8;font-weight:500}
.D .dh-c p{max-width:46ch;font-size:1.1rem;font-weight:300;opacity:.92;margin-bottom:28px}
.D .dbar{position:absolute;z-index:3;left:0;right:0;bottom:88px}
.D .dbar .wrap{display:flex;gap:14px;align-items:flex-end}
.D .dbar button{flex:1;text-align:left;color:#fff;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;opacity:.6;transition:opacity .3s}
.D .dbar button.on{opacity:1}
.D .dbar i{display:block;height:2px;background:rgba(255,255,255,.3);margin-top:8px;position:relative;overflow:hidden}
.D .dbar i::after{content:"";position:absolute;inset:0;background:#f5c9a8;transform:scaleX(0);transform-origin:left}
.D .dbar button.on i::after{animation:fill 6s linear forwards}
@keyframes fill{to{transform:scaleX(1)}}
.rv{opacity:0;transform:translateY(30px);transition:opacity 1s ease,transform 1s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
.dl1{transition-delay:.15s}.dl2{transition-delay:.3s}.dl3{transition-delay:.45s}.dl4{transition-delay:.6s}
.D .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding:90px 0 40px;text-align:center}
.D .stats b{display:block;font-family:"Cormorant Garamond",serif;font-size:clamp(3rem,7vw,5rem);color:var(--sea);line-height:1}
.D .stats b small{font-size:.5em;color:var(--terra)}
.D .stats span{font-size:.82rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.D .dhd{text-align:center;padding:50px 0 10px}
.D .dhd h2{font-size:clamp(2.2rem,5vw,3.6rem);color:var(--sea);margin-top:10px}
.D .dap{display:grid;grid-template-columns:1.3fr 1fr;gap:60px;align-items:center;padding:70px 0}
.D .dap:nth-child(even){grid-template-columns:1fr 1.3fr}
.D .dap:nth-child(even) .clip{order:2}
.D .clip{position:relative;aspect-ratio:4/3;overflow:hidden;border-radius:6px;clip-path:inset(14% 10% 14% 10% round 6px);transition:clip-path 1.4s cubic-bezier(.7,0,.2,1)}
.D .clip.in{clip-path:inset(0 0 0 0 round 6px)}
.D .clip .plx{position:absolute;inset:-8% 0;will-change:transform}
.D .clip .ph{position:absolute;inset:0}
.D .clip img{transform:scale(1.3);transition:transform 1.8s cubic-bezier(.2,.7,.2,1)}
.D .clip.in img{transform:scale(1)}
.D .clip:hover img{transform:scale(1.05)}
.D .dap .num{font-family:"Cormorant Garamond",serif;font-size:1rem;color:var(--terra);letter-spacing:.2em}
.D .dap h3{font-size:clamp(2.2rem,4vw,3.2rem);color:var(--sea);margin:8px 0 12px}
.D .dap p{color:#46515b;margin:0 0 18px}
.D .dap .meta{display:flex;gap:18px;flex-wrap:wrap;font-size:.9rem;color:var(--muted);margin-bottom:24px}
.D .dap .meta b{color:var(--ink);font-weight:500}
.D .dap .line{height:1px;background:var(--line);margin:0 0 20px;transform:scaleX(0);transform-origin:left;transition:transform 1.2s .3s ease}
.D .dap .in .line,.D .dap .line.in{transform:scaleX(1)}
.D .dcta{background:var(--sea);color:#fff;text-align:center;padding:110px 20px;margin-top:40px;overflow:hidden}
.D .dcta h2{font-size:clamp(2rem,4.6vw,3.6rem);max-width:20ch;margin:0 auto 30px;font-style:italic;font-weight:500}
.D .dcta .eyebrow{color:#f5c9a8;margin-bottom:16px}
@media (max-width:900px){
 .D .dap,.D .dap:nth-child(even){grid-template-columns:1fr;gap:26px;padding:44px 0}
 .D .dap:nth-child(even) .clip{order:0}
 .D .stats{grid-template-columns:1fr;gap:34px;padding:70px 0 20px}
 .D .dbar button span{display:none}
 .D .dh-c{padding-bottom:140px}
}
@media (prefers-reduced-motion:reduce){
 .rv,.D .clip,.D .clip img,.D .dap .line{transition:none!important;opacity:1;transform:none;clip-path:none}
 .D .dslide.on img,.D .dbar button.on i::after{animation:none}
}

/* lingue */
.langs{display:flex;gap:4px;align-items:center}
.langs button{width:30px;height:22px;border-radius:5px;overflow:hidden;opacity:.55;transition:.2s;box-shadow:0 0 0 1px rgba(0,0,0,.12);padding:0}
.langs button svg{display:block;width:100%;height:100%}
.langs button.on,.langs button:hover{opacity:1;box-shadow:0 0 0 2px var(--terra)}
.navr{display:flex;align-items:center;gap:22px}
@media (max-width:900px){.langs button{width:26px;height:19px}}
</style>
</head>

const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const io = "IntersectionObserver" in window ? new IntersectionObserver(es=>es.forEach(en=>{
  if(!en.isIntersecting) return;
  en.target.classList.add("in");
  const ap=en.target.closest('.dap'); if(ap) dSeen.add(ap.dataset.i);
  const c=en.target.querySelector("[data-count]"); if(c) countUp(c);
  io.unobserve(en.target);
}),{threshold:.18, rootMargin:"0px 0px -6% 0px"}) : null;
function observeAll(){
  document.querySelectorAll("#vC .rv:not(.in), #vC .clip:not(.in), #vC .line:not(.in)").forEach(el=>{ if(io && !reduce) io.observe(el); else el.classList.add("in"); });
}
function countUp(el){
  const to=+el.dataset.count, dec=+el.dataset.dec, comma=(L==="fr"||L==="de");
  const fmt=v=>{let s=v.toFixed(dec); return comma?s.replace(".",","):s;};
  if(reduce){el.textContent=fmt(to);return;}
  const t0=performance.now(), dur=1600;
  const step=now=>{const p=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-p,3); el.textContent=fmt(to*e); if(p<1) requestAnimationFrame(step);};
  requestAnimationFrame(step);
}
// parallax leggero
let ticking=false;
addEventListener("scroll",()=>{ if(ticking||reduce) return; ticking=true; requestAnimationFrame(()=>{
  if(document.getElementById("vC").classList.contains("on")){
    const H=innerHeight;
    document.querySelectorAll("#vC .plx").forEach(p=>{const r=p.parentElement.getBoundingClientRect(); if(r.bottom<0||r.top>H) return; const k=(r.top+r.height/2-H/2)/H; p.style.transform=`translateY(${(-k*40).toFixed(1)}px)`;});
  }
  ticking=false; });},{passive:true});

        <div class="num">0${i+1}</div>
        <div class="eyebrow" style="margin-top:14px">${a.tag[L]}</div>
        <h2>${a.nome}</h2>
        <p>${a.desc[L]}</p>
        <div class="facts"><span><b>${a.ospiti}</b>${t("g")}</span><span><b>${a.camere}</b>${a.camere>1?t("rN"):t("r1")}</span><span><b>${a.bagni}</b>${t("ba")}</span><span><b>★ ${rating(a)}</b>${a.reviews} ${t("reviews")}</span></div>
        <a class="btn b-line" style="color:var(--sea)">${t("more")}</a>
      </div>
    </article>`).join("");

  renderD();
  document.querySelectorAll('#vC [data-count]').forEach(c=>{ if(c.closest('.in')) { const v=+c.dataset.count, d=+c.dataset.dec; let x=v.toFixed(d); c.textContent=(L==='fr'||L==='de')?x.replace('.',','):x; } });
}
document.addEventListener("click",e=>{const b=e.target.closest(".langs button");if(!b)return;L=b.dataset.l;try{localStorage.setItem("soc_l",L)}catch(x){}render();});
document.querySelectorAll(".switch button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".switch button").forEach(x=>x.classList.toggle("on",x===b));
  document.querySelectorAll(".v").forEach(v=>v.classList.toggle("on",v.id==="v"+b.dataset.v));
  window.scrollTo(0,0);
  if(b.dataset.v==="C"){ dGo(0); dStart(); setTimeout(observeAll,50); }
});
render();
</script>
</body>
</html>

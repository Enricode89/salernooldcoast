.hub-foot{text-align:center;color:var(--muted);font-size:.85rem;padding:10px 24px 30px}
.hub-foot a{color:var(--acc)}

  tbd:"Coming soon",from_station:"From Salerno station",from_port:"From Molo Manfredi",from_bus:"From Piazza della Concordia",
  host_resp:"Replies within an hour",write:"Message on WhatsApp",call:"Call",tickets:"Timetables & tickets",
  train:"Train",train_t:"Naples in 40 min, Rome in about 2h30 by high-speed train. Regional trains to Cilento.",
  ferry:"Ferries & hydrofoils",ferry_t:"From Salerno harbour to Amalfi, Positano and the coast; Capri in about 1h30.",
  taxi:"Taxi & car",taxi_t:"Taxi rank in Piazza Vittorio Veneto, in front of the station. Ask the host about attended parking.",
  air:"Airport",air_t:"Naples Capodichino is 60 km away (train from Napoli Centrale or taxi). Salerno Costa d'Amalfi airport is 15 km away.",
  emerg:"Emergencies",emerg_t:"European emergency number 112 · Tourist medical service: ask the host.",
  foot:"Salerno Luxury Apartments · Enjoy your stay"}
};
const FLAGS={
 it:'<svg viewBox="0 0 3 2"><rect width="1" height="2" fill="#009246"/><rect x="1" width="1" height="2" fill="#fff"/><rect x="2" width="1" height="2" fill="#ce2b37"/></svg>',
 en:'<svg viewBox="0 0 60 30"><clipPath id="u"><path d="M0,0v30h60V0z"/></clipPath><path d="M0,0v30h60V0z" fill="#012169"/><path d="M0,0 60,30M60,0 0,30" stroke="#fff" stroke-width="6"/><path d="M0,0 60,30M60,0 0,30" stroke="#C8102E" stroke-width="3"/><path d="M30,0v30M0,15h60" stroke="#fff" stroke-width="10"/><path d="M30,0v30M0,15h60" stroke="#C8102E" stroke-width="6"/></svg>'
};

let L = (()=>{try{const s=localStorage.getItem("sla_lang");if(s==="it"||s==="en")return s}catch(e){} return (navigator.language||"it").slice(0,2)==="it"?"it":"en"})();
const t = k => T[L][k] ?? k;
const loc = o => o ? (o[L] ?? o.it) : null;
const $ = id => document.getElementById(id);
const val = v => v ? v : `<span class="tbd">${t("tbd")}</span>`;
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function langs(){
  $("langs").innerHTML = Object.keys(FLAGS).map(l=>`<button data-l="${l}" class="${l===L?"on":""}" aria-label="${l.toUpperCase()}">${FLAGS[l]}</button>`).join("");
}
function applyT(){
  document.documentElement.lang = L;
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t(e.dataset.t));
  document.querySelectorAll("[data-th]").forEach(e=>e.innerHTML=t(e.dataset.th));
}

function hub(){
  $("hub").innerHTML = APTS.map((a,i)=>`
    <a class="hc" href="#guida-${a.id}">
      <div class="ph"><img src="img/${a.id}-0.jpg" alt="${esc(a.nome)}" loading="${i<2?"eager":"lazy"}"></div>
      <div class="in">
        <div class="n">0${i+1}</div>
        <h2>${esc(a.nome)}</h2>
        <div class="ad">${esc(a.indirizzo)} · Salerno</div>
        <span class="go caps">${t("open")}</span>
      </div>
    </a>`).join("");
}

const row = (ic,title,sub,right) => `<div class="row"><div class="ic">${ic}</div><div class="tx"><b>${title}</b>${sub?`<small>${sub}</small>`:""}</div>${right!=null?`<div class="val">${right}</div>`:""}</div>`;
const sec = (id,eye,title,body) => `<section class="sec wrap" id="${id}"><div class="sh"><div class="caps">${t(eye)}</div><h2>${t(title)}</h2></div>${body}</section>`;

function guide(a){
  const addr = a.indirizzo+", 84121 Salerno SA";
  const i = APTS.indexOf(a);
  const wifiPass = a.wifiPass ? `${esc(a.wifiPass)}<button class="copy" data-copy="${esc(a.wifiPass)}">${t("copy")}</button>` : val(null);
  const R = COMUNE.regole;
  const yn = v => v===true?t("yes"):v===false?t("no"):val(null);

  const stay = `<div class="card">
      ${row("🔑",t("checkin"),null,val(a.checkin))}
      ${row("🚪",t("checkout"),null,val(a.checkout))}
      ${row("👥",t("guests"),null,a.ospiti)}
      ${row("🔐",t("access"),(a.accesso||COMUNE.accesso)?esc(loc(a.accesso||COMUNE.accesso)):val(null))}
    </div>
    <div class="card">
      ${row("📶",t("net"),null,val(a.wifiRete&&esc(a.wifiRete)))}
      ${row("🔒",t("pass"),null,wifiPass)}
      ${row("⚡",t("speed"),null,val(a.wifiVel&&esc(a.wifiVel)))}
    </div>
    <div class="card">
      ${row("❄️",t("ac"))}
      ${row("🍳",t("kitchen"))}
      ${row("☕",t("coffee"))}
      ${row("📺",t("tv"))}
      ${row("🧺",t("washer"))}
      ${a.extra.map(x=>row(x.ic,esc(loc(x)))).join("")}
      ${row("🚗",t("garage"),[COMUNE.garage.prezzo,COMUNE.garage.indirizzo].filter(Boolean).join(" · ")+(COMUNE.garage.indirizzo?`<br><a class="link" href="${M(COMUNE.garage.indirizzo)}" target="_blank" rel="noopener">${t("open_map")}</a>`:""))}
      ${row("🍼",t("cot"),COMUNE.culla.prezzo)}
      ${COMUNE.animali?row("🐾",t("pets")):""}
    </div>`;

  const out = COMUNE.checkoutPassi
    ? `<div class="card steps">${COMUNE.checkoutPassi.map(p=>row("",esc(loc(p)))).join("")}</div>`
    : `<div class="card">${row("📝",val(null))}</div>`;

  const rules = `<div class="card">
      ${row("🚭",t("smoke"),null,yn(R.fumo))}
      ${row("🎉",t("party"),null,yn(R.feste))}
      ${row("🌙",t("quiet"),null,val(R.silenzio&&esc(loc(R.silenzio))))}
      ${row("🐾",t("pets").split(" ")[0],null,COMUNE.animali?t("yes"):t("no"))}
    </div>`;

  const waste = `<div class="card"><div class="wnote">♻️ ${t("waste_note")}</div>${RIFIUTI.map(d=>`<div class="wk"><div class="d">${loc(d)}</div><div class="its">${d.r.length?d.r.map(([k,h])=>`<span class="chip" style="background:${CAT[k].c}">${esc(loc(CAT[k]))} <small>${h}</small></span>`).join(""):`<span class="none">${t("waste_none")}</span>`}</div></div>`).join("")}</div>`;

  const reach = `<div class="btns"><a class="btn" href="${M(addr)}" target="_blank" rel="noopener">📍 ${esc(a.indirizzo)}</a></div>
    <div class="card">
      ${row("🚆",t("from_station"),`<a class="link" href="${DIR("Stazione di Salerno",addr)}" target="_blank" rel="noopener">${t("open_map")}</a>`)}
      ${row("⛴",t("from_port"),`<a class="link" href="${DIR("Molo Manfredi, Salerno",addr)}" target="_blank" rel="noopener">${t("open_map")}</a>`)}
      ${row("🚌",t("from_bus"),`<a class="link" href="${DIR("Piazza della Concordia, Salerno",addr)}" target="_blank" rel="noopener">${t("open_map")}</a>`)}
    </div>`;

  const msg = encodeURIComponent((L==="it"?"Ciao Alessandro, sono ospite a ":"Hi Alessandro, I'm staying at ")+a.nome+". ");
  const host = `<div class="card">
      ${row("👤",HOST.nome,`★ ${HOST.rating} · ${t("superhost")} · ${t("host_resp")}`)}
    </div>
    <div class="btns">
      <a class="btn" href="https://wa.me/${HOST.wa}?text=${msg}" target="_blank" rel="noopener">${t("write")}</a>
      <a class="btn ghost" href="tel:${HOST.tel.replace(/\s/g,"")}">${t("call")} ${HOST.tel}</a>
    </div>`;

  const see = `<div class="card">${ATTRAZIONI.map(x=>row("🏛",x.n,`${esc(loc(x))}<br><a class="link" href="${DIR(addr,x.q)}" target="_blank" rel="noopener">${t("open_map")}</a>`)).join("")}</div>`;

  const coast = `<div class="card">${COSTIERA.map(x=>row("⛵",x.n,`${esc(loc(x))}<br><a class="link" href="${M(x.q)}" target="_blank" rel="noopener">${t("open_map")}</a>`)).join("")}</div>
    <div class="btns">${OPERATORI.map(o=>`<a class="btn ghost" href="${o.u}" target="_blank" rel="noopener">${o.n} · ${t("tickets")}</a>`).join("")}</div>`;

  const eat = MANGIARE.map(g=>`<div class="grp">${g.ic} ${esc(loc(g.g))}</div><div class="card">${g.l.map(([n,p])=>row("",n,`<a class="link" href="${M(n+" Salerno")}" target="_blank" rel="noopener">${t("open_map")}</a>`,`<span class="price">${p}</span>`)).join("")}</div>`).join("");

  const move = `<div class="card">
      ${row("🚆",t("train"),t("train_t"))}
      ${row("⛴",t("ferry"),t("ferry_t"))}
      ${row("🚕",t("taxi"),t("taxi_t"))}
      ${row("✈️",t("air"),t("air_t"))}
      ${row("🆘",t("emerg"),t("emerg_t"))}
    </div>`;

  $("p-guide").innerHTML = `
    <div class="cover" id="top">
      <img src="img/${a.id}-0-hd.jpg" alt="${esc(a.nome)}" onerror="this.src='img/${a.id}-0.jpg'">
      <a class="back caps" href="#home">← ${t("back")}</a>
      <div class="in">
        <span class="badge caps">★ ${t("superhost")}</span>
        <h1>${esc(a.nome)}</h1>
        <div class="ad">${esc(a.indirizzo)} · Salerno</div>
      </div>
    </div>
    <div class="quick">
      <div><small>${t("checkin")}</small><b>${a.checkin||"—"}</b></div>
      <div><small>${t("checkout")}</small><b>${a.checkout||"—"}</b></div>
      <div><small>${t("wifi")}</small><b>${a.wifiVel||"✓"}</b></div>
      <a href="${M(addr)}" target="_blank" rel="noopener"><small>${t("map")}</small><b>${t("open_map")} ↗</b></a>
    </div>
    <div class="wrap welcome">
      <p>“${t("welcome")}”</p>
      <div class="sig">— ${HOST.nome}</div>
      <div class="tiles">
        <a href="#s-stay"><span>🏠</span>${t("t_stay")}</a>
        <a href="#s-see"><span>🏛</span>${t("t_see")}</a>
        <a href="#s-eat"><span>🍝</span>${t("t_eat")}</a>
        <a href="#s-move"><span>🚆</span>${t("t_move")}</a>
      </div>
    </div>
    ${sec("s-stay","e_stay","s_stay",stay)}
    ${sec("s-out","e_out","s_out",out)}
    ${sec("s-rules","e_rules","s_rules",rules)}
    ${sec("s-waste","e_waste","s_waste",waste)}
    ${sec("s-reach","e_reach","s_reach",reach)}
    ${sec("s-host","e_host","s_host",host)}
    ${sec("s-see","e_see","s_see",see)}
    ${sec("s-coast","e_coast","s_coast",coast)}
    ${sec("s-eat","e_eat","s_eat",eat)}
    ${sec("s-move","e_move","s_move",move)}
    <div class="gfoot">${t("foot")}</div>`;

  $("bnav").innerHTML = [["top","🏠","t_home"],["s-stay","🔑","t_stay"],["s-see","🏛","t_see"],["s-eat","🍝","t_eat"],["s-move","🚆","t_move"]]
    .map(([id,ic,k])=>`<a href="#${id}" data-sec="${id}"><span>${ic}</span>${t(k)}</a>`).join("");
}

let cur = null;
function route(){
  const h = location.hash.slice(1);
  const m = h.match(/^guida-(\w+)$/);
  if (m && APTS.find(a=>a.id===m[1])) { cur = APTS.find(a=>a.id===m[1]); }
  else if (h==="" || h==="home") { cur = null; }
  else if (cur && document.getElementById(h)) { return; } // in-page anchor
  render(); window.scrollTo(0,0);
}
function render(){
  applyT(); langs();
  $("p-home").classList.toggle("show", !cur);
  $("p-guide").classList.toggle("show", !!cur);
  $("bnav").classList.toggle("show", !!cur);
  if (cur) { guide(cur); document.title = cur.nome+" — Guida · Salerno Luxury Apartments"; }
  else { hub(); document.title = "Guide degli ospiti — Salerno Luxury Apartments"; }
}

document.addEventListener("click", e=>{
  const lb = e.target.closest("[data-l]");
  if (lb) { L = lb.dataset.l; try{localStorage.setItem("sla_lang",L)}catch(_){} const y = scrollY; render(); scrollTo(0,y); return; }
  const cp = e.target.closest("[data-copy]");
  if (cp) { navigator.clipboard?.writeText(cp.dataset.copy).then(()=>{cp.textContent=t("copied");setTimeout(()=>cp.textContent=t("copy"),1500)}); return; }
  const a = e.target.closest('a[href^="#"]');
  if (a && cur) {
    const id = a.getAttribute("href").slice(1);
    if (id!=="home" && !id.startsWith("guida-")) { e.preventDefault(); document.getElementById(id)?.scrollIntoView({behavior:"smooth"}); }
  }
});
addEventListener("scroll", ()=>{
  if (!cur) return;
  const ids = ["top","s-stay","s-see","s-eat","s-move"];
  let on = "top";
  for (const id of ["top","s-stay","s-out","s-rules","s-waste","s-reach","s-host","s-see","s-coast","s-eat","s-move"]) {
    const el = document.getElementById(id); if (el && el.getBoundingClientRect().top < innerHeight*.4) on = id;
  }
  const map = {"s-out":"s-stay","s-rules":"s-stay","s-waste":"s-stay","s-reach":"s-stay","s-host":"s-stay","s-coast":"s-see"};
  on = map[on] || on;
  document.querySelectorAll(".bnav a").forEach(x=>x.classList.toggle("on", x.dataset.sec===on));
}, {passive:true});
addEventListener("hashchange", route);
route();
</script>
</body>
</html>
